<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妖狐煙屋 お会計ガチャ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>妖狐煙屋 お会計ガチャ</h1>
        <p class="subtitle">ランダムで予算額のギリギリを攻めます</p>
        
        <div class="setting-container">
            <div class="setting-group">
                <label for="budget-type">予算</label>
                <select id="budget-type">
                    <option value="max">最高</option>
                    <option value="min">最低</option>
                </select>
            </div>
            <div class="setting-group">
                <input type="number" id="budget-amount" value="5000" min="0" step="50">
                <span>円 / </span>
            </div>
            <div class="setting-group">
                <input type="number" id="stay-hours" value="2" max="7" min="1" step="1">
                <span>時間</span>
            </div>
        </div>

        <p class="subtitle">
            「最高」は予算内に収めたい場合、「最低」はイベント総計特典を目指す場合に選択してください。<br>
            滞在時間は1～7時間です。
        </p>

        <button class="btn" id="gacha-btn">お会計</button>

        <div class="result-container" id="result-area">
            <div class="result-title">ガチャ結果</div>
            <div id="result-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
